<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quản Lý Gia Đình - Tổ Ấm Số (Android APK)</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 0;
      background-color: #f4f6fb;
      color: #090d16;
      padding-bottom: 85px;
    }
    .header {
      background: #fcd34d;
      border-bottom: 3px solid #0f172a;
      box-shadow: 0 4px 0 #0f172a;
      padding: 14px 16px;
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
    }
    .title { font-size: 19px; font-weight: 900; margin: 0; }
    .subtitle { font-size: 12px; font-weight: 800; color: #1e293b; margin-top: 2px; }
    .container { max-width: 680px; margin: 0 auto; padding: 14px; }
    .card-3d {
      background: #fff;
      border: 2.5px solid #0f172a;
      border-radius: 16px;
      box-shadow: 0 4px 0 #0f172a;
      padding: 14px;
      margin-bottom: 14px;
    }
    .btn-3d {
      border: 2.5px solid #0f172a;
      border-radius: 12px;
      box-shadow: 0 3.5px 0 #0f172a;
      font-weight: 900;
      padding: 10px 14px;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 13px;
      background: #fcd34d; color: #0f172a;
    }
    .btn-3d:active { transform: translateY(2px); box-shadow: 0 1px 0 #0f172a; }
    .input-3d {
      width: 100%; padding: 10px 12px;
      border: 2.5px solid #0f172a; border-radius: 10px;
      font-weight: 700; font-size: 14px; margin-bottom: 8px;
    }
    .badge {
      display: inline-block; padding: 3px 9px;
      border: 2px solid #0f172a; border-radius: 99px;
      font-size: 11px; font-weight: 900;
      box-shadow: 0 2px 0 #0f172a;
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff; border-top: 3px solid #0f172a;
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 4px; padding: 8px; z-index: 30;
    }
    .nav-btn {
      border: 2px solid transparent; border-radius: 12px;
      background: transparent; font-weight: 900; font-size: 11px;
      padding: 8px 4px; text-align: center; cursor: pointer;
    }
    .nav-btn.active {
      background: #fcd34d; border-color: #0f172a;
      box-shadow: 0 2px 0 #0f172a;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1 class="title">🏠 QUẢN LÝ GIA ĐÌNH</h1>
      <div class="subtitle">Tổ Ấm Số • Phiên bản Android APK</div>
    </div>
    <button class="btn-3d" onclick="toggleCloudModal()" style="background:#38bdf8;">🌐 Kết nối Vercel</button>
  </div>

  <div class="container">
    <!-- Hộp kết nối máy chủ Vercel + Neon -->
    <div id="cloudBox" class="card-3d" style="background:#e0f2fe; display:none;">
      <div style="font-weight:900; font-size:14px; margin-bottom:6px;">🔗 ĐỒNG BỘ TRỰC TIẾP VỚI MÁY CHỦ VERCEL + NEON</div>
      <div style="font-size:12px; font-weight:700; margin-bottom:8px;">
        Nhập địa chỉ Web sau khi bạn deploy lên Vercel (VD: https://quan-ly-gia-dinh.vercel.app) để đồng bộ dữ liệu thời gian thực với cả nhà:
      </div>
      <input id="vercelUrlInput" class="input-3d" type="url" placeholder="https://quan-ly-gia-dinh.vercel.app" />
      <div style="display:flex; gap:8px;">
        <button class="btn-3d" style="background:#10b981; flex:1;" onclick="connectVercel()">Lưu & Kết Nối Ngay</button>
        <button class="btn-3d" style="background:#fff;" onclick="toggleCloudModal()">Đóng</button>
      </div>
    </div>

    <!-- Nội dung động theo Tab -->
    <div id="tabContent"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-finance" onclick="switchTab('finance')">💰 Thu - Chi</button>
    <button class="nav-btn" id="nav-schedule" onclick="switchTab('schedule')">🎒 Lịch Con</button>
    <button class="nav-btn" id="nav-events" onclick="switchTab('events')">🕯️ Giỗ / Lễ</button>
    <button class="nav-btn" id="nav-vault" onclick="switchTab('vault')">🔐 Lưu Trữ</button>
  </div>

  <script>
    const savedVercel = localStorage.getItem('FAMILY_VERCEL_URL');
    if (savedVercel && savedVercel.startsWith('http')) {
      window.location.replace(savedVercel);
    }

    function toggleCloudModal() {
      const el = document.getElementById('cloudBox');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
      if (savedVercel) document.getElementById('vercelUrlInput').value = savedVercel;
    }

    function connectVercel() {
      const val = document.getElementById('vercelUrlInput').value.trim();
      if (!val.startsWith('http')) {
        alert('Vui lòng nhập đường dẫn bắt đầu bằng https://');
        return;
      }
      localStorage.setItem('FAMILY_VERCEL_URL', val);
      window.location.href = val;
    }

    const state = JSON.parse(localStorage.getItem('FAMILY_APK_STATE') || 'null') || {
      expenses: [
        { id: 1, title: 'Tiền chợ & Thực phẩm tuần', amount: 1500000, cycle: 'Tuần', due: 'Thứ 2', paid: false },
        { id: 2, title: 'Quỹ lớp & Bán trú 2 con', amount: 2400000, cycle: 'Tháng', due: 'Ngày 05', paid: true },
        { id: 3, title: 'Tiền điện EVN & Nước sạch', amount: 1850000, cycle: 'Tháng', due: 'Ngày 12', paid: false },
        { id: 4, title: 'Học phí Tiếng Anh ILA', amount: 3200000, cycle: 'Tháng', due: 'Ngày 15', paid: false },
        { id: 5, title: 'Bảo hiểm Y tế & Nhân thọ', amount: 18000000, cycle: 'Năm', due: '15/11', paid: false }
      ],
      schedules: [
        { id: 1, child: 'Bé Minh Khôi', subject: 'Học chính khóa Lớp 5A', day: 'Thứ 2 - Thứ 6', time: '07:15 - 16:30', dropoff: 'Bố Minh', pickup: 'Mẹ Lan' },
        { id: 2, child: 'Bé Minh Khôi', subject: 'Tiếng Anh ILA', day: 'Thứ 4', time: '18:00 - 19:30', dropoff: 'Mẹ Lan', pickup: 'Bố Minh' },
        { id: 3, child: 'Bé Bảo An', subject: 'Lớp Vẽ & Đàn Piano', day: 'Thứ 7', time: '15:00 - 17:00', dropoff: 'Mẹ Lan', pickup: 'Bố Minh' }
      ],
      events: [
        { id: 1, title: 'Giỗ Ông Nội', date: '15/10 Âm lịch', note: 'Chuẩn bị hoa sen trắng & lễ vật' },
        { id: 2, title: 'Giỗ Bà Ngoại', date: '24/11 Âm lịch', note: 'Về quê ngoại sáng sớm' },
        { id: 3, title: 'Sinh nhật Bé Bảo An', date: '12/12 Dương lịch', note: 'Đặt bánh kem dâu tây' }
      ],
      accounts: [
        { id: 1, title: 'Violympic Toán (Bé Minh Khôi)', user: 'minhkhoi_5a_2026', pass: 'Khoi@2026#' },
        { id: 2, title: 'Tiếng Anh IOE (Bé Minh Khôi)', user: 'khoinm_ioe5a', pass: 'IoePass@123' },
        { id: 3, title: 'Trạng Nguyên Tiếng Việt (Bé Bảo An)', user: 'baoan_lop2b', pass: 'BaoAn2019!' },
        { id: 4, title: 'Thẻ BHYT Bé Minh Khôi', user: 'HS4797938291022', pass: 'BV Nhi Đồng 2' }
      ]
    };

    function saveState() {
      localStorage.setItem('FAMILY_APK_STATE', JSON.stringify(state));
    }

    let currentTab = 'finance';
    function switchTab(tab) {
      currentTab = tab;
      ['finance', 'schedule', 'events', 'vault'].forEach(t => {
        document.getElementById('nav-' + t).className = 'nav-btn' + (t === tab ? ' active' : '');
      });
      render();
    }

    function togglePay(id) {
      const item = state.expenses.find(e => e.id === id);
      if (item) { item.paid = !item.paid; saveState(); render(); }
    }

    function render() {
      const box = document.getElementById('tabContent');
      if (currentTab === 'finance') {
        box.innerHTML = '<div class="card-3d" style="background:#34d399;"><div style="font-size:12px;font-weight:900;">KHOẢN ĐÓNG ĐỊNH KỲ (TUẦN / THÁNG / NĂM)</div><div style="font-size:20px;font-weight:900;margin-top:4px;">Chạm để đánh dấu Đã đóng</div></div>' +
          state.expenses.map(e => `
            <div class="card-3d" style="background:${e.paid ? '#ecfdf5' : '#fff'}">
              <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                <span class="badge" style="background:#fde68a;">Định kỳ: ${e.cycle} (${e.due})</span>
                <span class="badge" style="background:${e.paid ? '#34d399' : '#fb7185'};color:${e.paid ? '#000' : '#fff'}">${e.paid ? '✓ ĐÃ ĐÓNG' : 'CHƯA ĐÓNG'}</span>
              </div>
              <div style="font-size:16px;font-weight:900;">${e.title}</div>
              <div style="font-size:19px;font-weight:900;color:#1d4ed8;margin:4px 0 10px;">${e.amount.toLocaleString('vi-VN')} đ</div>
              <button class="btn-3d" style="width:100%;background:${e.paid ? '#e2e8f0' : '#34d399'}" onclick="togglePay(${e.id})">
                ${e.paid ? 'Hoàn tác (Chưa đóng)' : '✓ Đánh dấu ĐÃ ĐÓNG'}
              </button>
            </div>
          `).join('');
      } else if (currentTab === 'schedule') {
        box.innerHTML = '<div class="card-3d" style="background:#7dd3fc;"><div style="font-size:16px;font-weight:900;">🎒 LỊCH HỌC & ĐƯA ĐÓN CON</div></div>' +
          state.schedules.map(s => `
            <div class="card-3d">
              <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                <span class="badge" style="background:#0f172a;color:#fff;">${s.day}</span>
                <span class="badge" style="background:#fde68a;">${s.time}</span>
              </div>
              <div style="font-size:13px;font-weight:900;color:#1d4ed8;">${s.child}</div>
              <div style="font-size:16px;font-weight:900;margin-bottom:8px;">${s.subject}</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div style="background:#dbeafe;border:2px solid #0f172a;border-radius:10px;padding:8px;font-size:12px;font-weight:900;">🚗 Đưa: ${s.dropoff}</div>
                <div style="background:#ffe4e6;border:2px solid #0f172a;border-radius:10px;padding:8px;font-size:12px;font-weight:900;">🛵 Đón: ${s.pickup}</div>
              </div>
            </div>
          `).join('');
      } else if (currentTab === 'events') {
        box.innerHTML = '<div class="card-3d" style="background:#fda4af;"><div style="font-size:16px;font-weight:900;">🕯️ LỊCH GIỖ & SỰ KIỆN ÂM/DƯƠNG</div></div>' +
          state.events.map(ev => `
            <div class="card-3d">
              <span class="badge" style="background:#fde68a;">🌙 ${ev.date}</span>
              <div style="font-size:17px;font-weight:900;margin-top:6px;">${ev.title}</div>
              <div style="font-size:12px;font-weight:700;color:#334155;margin-top:4px;">📝 ${ev.note}</div>
            </div>
          `).join('');
      } else {
        box.innerHTML = '<div class="card-3d" style="background:#c4b5fd;"><div style="font-size:16px;font-weight:900;">🔐 KHO TÀI KHOẢN & GIẤY TỜ</div></div>' +
          state.accounts.map(a => `
            <div class="card-3d">
              <div style="font-size:15px;font-weight:900;margin-bottom:6px;">${a.title}</div>
              <div style="background:#f1f5f9;border:2px solid #0f172a;border-radius:10px;padding:8px;font-size:13px;font-weight:900;margin-bottom:6px;">User/Mã số: ${a.user}</div>
              <div style="background:#fef3c7;border:2px solid #0f172a;border-radius:10px;padding:8px;font-size:13px;font-weight:900;">Pass/Nơi cấp: ${a.pass}</div>
            </div>
          `).join('');
      }
    }
    render();
  </script>
</body>
</html>
