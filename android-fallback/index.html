<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quản Lý Gia Đình - Tổ Ấm Số</title>
  <style>
    * { box-sizing: border-box; font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 24px;
      background: linear-gradient(135deg, #1E40AF 0%, #2563EB 50%, #4F46E5 100%);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .logo-box {
      width: 76px; height: 76px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800;
      margin-bottom: 18px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 24px; font-weight: 800; margin: 0 0 8px; }
    p { font-size: 14px; font-weight: 500; opacity: 0.9; margin: 0 0 24px; max-width: 320px; line-height: 1.5; }
    .spinner {
      width: 38px; height: 38px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo-box">GĐ</div>
  <h1>Quản Lý Gia Đình</h1>
  <p>Tổ Ấm Số • Đang mở không gian gia đình...</p>
  <div class="spinner"></div>
  <script>
    // Xóa bỏ mọi cấu hình URL cũ lưu trong localStorage và vào thẳng ứng dụng chính
    try { localStorage.removeItem('FAMILY_VERCEL_URL'); } catch (e) {}
    window.location.replace('https://minhtramqlgd.vercel.app');
  </script>
</body>
</html>
